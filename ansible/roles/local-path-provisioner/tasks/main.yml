# tasks file for local-path-provisioner
# Storage leggero per cluster mononodo — crea PV come directory su disco locale.
---
# Manifest vendored in files/ (versione in fun_kube/versions.py).
- name: Copy local-path-provisioner manifest
  ansible.builtin.copy:
    src: local-path-storage.yaml
    dest: /tmp/local-path-storage.yaml
    mode: '0644'

- name: Wait for API server to be reachable
  ansible.builtin.command: kubectl version --output=json
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  register: _api_check
  until: _api_check.rc == 0
  retries: 12
  delay: 15

- name: Apply local-path-provisioner
  ansible.builtin.command: kubectl apply -f /tmp/local-path-storage.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true
  register: _lpp_apply
  until: _lpp_apply.rc == 0
  retries: 5
  delay: 15

- name: Wait for local-path-provisioner to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/local-path-provisioner
    -n local-path-storage --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

# Default solo se Longhorn non è abilitato: con Longhorn sul mononodo la default è
# longhorn (dalla sua ConfigMap), altrimenti ci sarebbero due StorageClass default.
# local-path resta disponibile per uso esplicito (es. NPM su mononodo).
- name: Set local-path default-class annotation
  ansible.builtin.command: >
    kubectl patch storageclass local-path
    -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"{{ 'false' if longhorn_enabled | default(false) | bool else 'true' }}"}}}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _lp_default
  changed_when: "'no change' not in _lp_default.stdout"
