# tasks file for containerd
---
- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false
  become: true

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ ansible_architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  become: true

# containerd_version (fun_kube/versions.py) è un prefisso: si installa l'ultima
# revisione apt disponibile per quella versione (es. 2.3.6 → 2.3.6-1~ubuntu.24.04~noble).
- name: Resolve exact containerd.io apt version
  ansible.builtin.shell: |
    set -o pipefail
    apt-cache madison containerd.io | awk '{print $3}' | grep "^{{ containerd_version }}-" | sort -V | tail -1
  args:
    executable: /bin/bash
  register: _containerd_exact_ver
  changed_when: false
  failed_when: false
  become: true

- name: Fail if containerd version is not available
  ansible.builtin.fail:
    msg: >-
      containerd.io {{ containerd_version }} non disponibile nel repo Docker per
      {{ ansible_distribution_release }}. Versioni disponibili:
      apt-cache madison containerd.io
  when: _containerd_exact_ver.stdout | trim == ""

# Su un nodo già nel cluster il cambio di versione riavvierebbe containerd (e
# tutti i container) su tutti i nodi in contemporanea: si mantiene la versione
# installata e si segnala. Nodi nuovi o dopo reset ricevono la versione pinnata.
- name: Check if node is already part of a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _ctd_joined
  become: true

- name: Get installed containerd.io version
  ansible.builtin.command: dpkg-query -W -f=${Version} containerd.io
  register: _containerd_installed
  changed_when: false
  failed_when: false
  become: true

- name: Warn — containerd version differs on running node (not changed)
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: containerd.io {{ _containerd_installed.stdout }} installato,
      versione fissata {{ _containerd_exact_ver.stdout | trim }}. Nodo già nel cluster:
      versione NON modificata. Per aggiornarlo: drain del nodo, apt install
      containerd.io={{ _containerd_exact_ver.stdout | trim }}, uncordon.
  when:
    - _ctd_joined.stat.exists
    - _containerd_installed.rc == 0
    - _containerd_installed.stdout != _containerd_exact_ver.stdout | trim

- name: Install containerd.io (pinned)
  ansible.builtin.apt:
    name: "containerd.io={{ _containerd_exact_ver.stdout | trim }}"
    state: present
    allow_downgrade: true
  become: true
  notify: Restart containerd
  when: >-
    not _ctd_joined.stat.exists
    or _containerd_installed.rc != 0
    or _containerd_installed.stdout == _containerd_exact_ver.stdout | trim

- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'
  become: true

# Genera il config atteso (default + SystemdCgroup=true) e lo applica solo se diverso
- name: Generate and apply containerd config (idempotent)
  ansible.builtin.shell: |
    containerd config default > /tmp/_containerd_new.toml
    sed -i 's/^\(\s*\)SystemdCgroup = false/\1SystemdCgroup = true/' /tmp/_containerd_new.toml
    if diff -q /tmp/_containerd_new.toml /etc/containerd/config.toml > /dev/null 2>&1; then
      echo "ok"
    else
      cp /tmp/_containerd_new.toml /etc/containerd/config.toml
      echo "updated"
    fi
  args:
    executable: /bin/bash
  register: _containerd_config_result
  changed_when: "_containerd_config_result.stdout | trim == 'updated'"
  become: true
  notify: Restart containerd

- name: Flush handlers (restart containerd now if config changed)
  ansible.builtin.meta: flush_handlers

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true
  become: true
