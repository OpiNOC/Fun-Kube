# tasks file for calico
# Manifest vendored in files/ (versione in fun_kube/versions.py).
# Da Calico 3.30 i CRD sono in operator-crds.yaml, separati dall'operatore:
# vanno applicati prima. Server-side apply: i CRD superano il limite di 262KB
# dell'annotation last-applied del client-side apply.
---
- name: Copy Calico manifests
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/{{ item }}"
    mode: '0644'
  loop:
    - operator-crds.yaml
    - tigera-operator.yaml
  delegate_to: "{{ first_cp_hostname }}"
  run_once: true

- name: Apply Calico CRDs and operator
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /tmp/{{ item }}
  loop:
    - operator-crds.yaml
    - tigera-operator.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ first_cp_hostname }}"
  run_once: true
  changed_when: true

- name: Apply Calico Installation with custom pod CIDR
  ansible.builtin.shell: |
    cat <<EOF | kubectl apply -f -
    apiVersion: operator.tigera.io/v1
    kind: Installation
    metadata:
      name: default
    spec:
      calicoNetwork:
        ipPools:
        - name: default-ipv4-ippool
          cidr: {{ pod_cidr }}
          encapsulation: VXLAN
          natOutgoing: Enabled
          nodeSelector: all()
    EOF
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ first_cp_hostname }}"
  run_once: true
  register: _calico_installation
  # i CRD appena creati possono non essere ancora Established
  until: _calico_installation.rc == 0
  retries: 6
  delay: 10
  changed_when: "'unchanged' not in _calico_installation.stdout"

- name: Wait for calico-node DaemonSet to be created by operator
  ansible.builtin.shell: |
    kubectl get daemonset calico-node -n calico-system --no-headers 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ first_cp_hostname }}"
  run_once: true
  register: calico_ds_count
  retries: 30
  delay: 10
  until: calico_ds_count.stdout | int > 0
  changed_when: false

- name: Wait for Calico pods to be running
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready pod
    -l k8s-app=calico-node -n calico-system --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  delegate_to: "{{ first_cp_hostname }}"
  run_once: true
  changed_when: false
  ignore_errors: true
