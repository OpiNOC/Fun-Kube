# tasks file for metrics-server
---
# Manifest vendored in files/ (versione in fun_kube/versions.py).
# Su kubeadm i kubelet usano certificati self-signed: --kubelet-insecure-tls è
# obbligatorio altrimenti kubectl top non funziona mai. Il flag è già inserito nel
# manifest da scripts/vendor-manifests.py: un patch dopo l'apply verrebbe annullato
# dall'apply al run seguente (args è una lista), causando 2 rollout ad ogni run.
- name: Copy metrics-server manifest
  ansible.builtin.copy:
    src: components.yaml
    dest: /tmp/metrics-server.yaml
    mode: '0644'

- name: Apply metrics-server manifest
  ansible.builtin.command: kubectl apply -f /tmp/metrics-server.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _ms_apply
  changed_when: "'configured' in _ms_apply.stdout or 'created' in _ms_apply.stdout"

# Rete di sicurezza: se il flag manca (es. manifest vendored senza patch),
# viene aggiunto via patch.
- name: Check --kubelet-insecure-tls on deployment
  ansible.builtin.command: >
    kubectl get deployment metrics-server -n kube-system
    -o jsonpath='{.spec.template.spec.containers[0].args}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _ms_args
  changed_when: false

- name: Patch deployment — add --kubelet-insecure-tls
  ansible.builtin.command: >
    kubectl patch deployment metrics-server -n kube-system
    --type=json
    -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true
  when: "'--kubelet-insecure-tls' not in _ms_args.stdout"

- name: Wait for metrics-server to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment/metrics-server
    -n kube-system --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
