# tasks file for metrics-server
---
- name: Resolve latest metrics-server version
  ansible.builtin.uri:
    url: https://api.github.com/repos/kubernetes-sigs/metrics-server/releases/latest
    return_content: true
  register: ms_release
  when: metrics_server_version == "latest"

- name: Set resolved metrics-server version
  ansible.builtin.set_fact:
    ms_version_resolved: >-
      {{ (ms_release.json.tag_name)
         if metrics_server_version == "latest"
         else metrics_server_version }}

- name: Download metrics-server manifest
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ ms_version_resolved }}/components.yaml"
    dest: /tmp/metrics-server.yaml
    mode: '0644'
    force: true

# Su kubeadm i kubelet usano certificati self-signed:
# --kubelet-insecure-tls è obbligatorio altrimenti kubectl top non funziona mai.
# Il flag va nel manifest PRIMA dell'apply: un patch successivo verrebbe
# annullato dall'apply al run seguente (args è una lista, viene sostituita),
# causando due rollout del deployment ad ogni esecuzione.
- name: Add --kubelet-insecure-tls to manifest
  ansible.builtin.replace:
    path: /tmp/metrics-server.yaml
    regexp: '^(\s+)- --secure-port=10250$'
    replace: '\1- --secure-port=10250\n\1- --kubelet-insecure-tls'

- name: Apply metrics-server manifest
  ansible.builtin.command: kubectl apply -f /tmp/metrics-server.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _ms_apply
  changed_when: "'configured' in _ms_apply.stdout or 'created' in _ms_apply.stdout"

# Rete di sicurezza: se upstream cambia la struttura degli args e il replace
# sopra non trova la riga, il flag viene aggiunto via patch.
- name: Check --kubelet-insecure-tls on deployment
  ansible.builtin.command: >
    kubectl get deployment metrics-server -n kube-system
    -o jsonpath='{.spec.template.spec.containers[0].args}'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: _ms_args
  changed_when: false

- name: Patch deployment — add --kubelet-insecure-tls
  ansible.builtin.command: >
    kubectl patch deployment metrics-server -n kube-system
    --type=json
    -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true
  when: "'--kubelet-insecure-tls' not in _ms_args.stdout"

- name: Wait for metrics-server to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment/metrics-server
    -n kube-system --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
