# tasks file for kubeadm
# Nota: k8s_version_resolved è risolto dal runner Python e passato come extra_var.
---
- name: Determine k8s minor version for repo
  ansible.builtin.set_fact:
    k8s_minor_version: "{{ k8s_version_resolved | regex_replace('^v?(\\d+\\.\\d+).*', '\\1') }}"

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/Release.key"
    dest: "/etc/apt/keyrings/kubernetes-{{ k8s_minor_version }}.asc"
    mode: '0644'
    force: false
  become: true

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-{{ k8s_minor_version }}.asc] https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor_version }}/deb/ /"
    state: present
    filename: "kubernetes-{{ k8s_minor_version }}"
  become: true

# Su un nodo già nel cluster cambiare versione ai pacchetti NON è un upgrade:
# kubelet diventerebbe più nuovo dell'API server (skew non supportato) senza
# passare da `kubeadm upgrade`. Il cambio di versione è permesso solo su nodi
# non ancora joinati (nodi nuovi o dopo `fun-kube reset`).
- name: Check if node is already part of a cluster
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: _k8s_joined
  become: true

- name: Get installed kubelet version
  ansible.builtin.command: dpkg-query -W -f=${Version} kubelet
  register: _kubelet_installed
  changed_when: false
  failed_when: false
  become: true

- name: Fail on Kubernetes version change on a running node
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} fa già parte del cluster con kubelet
      {{ _kubelet_installed.stdout.split('-')[0] }}, ma la versione richiesta è
      {{ k8s_version_resolved | regex_replace('^v', '') }}. up non aggiorna Kubernetes:
      riportare K8S_VERSION in .env a v{{ _kubelet_installed.stdout.split('-')[0] }}
      e usare ./fun-kube upgrade --to {{ k8s_version_resolved }} (kubeadm upgrade,
      un nodo alla volta, aggiorna anche il .env).
      Nota: K8S_VERSION=latest cambia valore quando esce una nuova versione upstream.
  when:
    - _k8s_joined.stat.exists
    - _kubelet_installed.rc == 0
    - _kubelet_installed.stdout | length > 0
    - _kubelet_installed.stdout.split('-')[0] != k8s_version_resolved | regex_replace('^v', '')

# Su un ri-provisioning dopo reset i pacchetti sono in hold: senza unhold apt
# non può cambiarne la versione (upgrade/downgrade) e l'install fallisce.
- name: Unhold kubernetes packages (re-provisioning)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true
  failed_when: false

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version_resolved | regex_replace('^v', '') }}-1.1"
      - "kubeadm={{ k8s_version_resolved | regex_replace('^v', '') }}-1.1"
      - "kubectl={{ k8s_version_resolved | regex_replace('^v', '') }}-1.1"
    state: present
    update_cache: true
    allow_downgrade: true
  become: true
  register: _k8s_install_strict
  ignore_errors: true

# ansible_failed_result esiste solo dentro un blocco rescue: va usato il register.
- name: Install kubelet, kubeadm and kubectl (fallback — ultima versione del repo minor)
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
  become: true
  when: _k8s_install_strict is failed

- name: Hold kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Enable kubelet service
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
  become: true
