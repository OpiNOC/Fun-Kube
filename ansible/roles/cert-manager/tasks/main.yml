# tasks file for cert-manager
# Manifest vendored in files/ (versione in fun_kube/versions.py).
---
- name: Copy cert-manager manifest
  ansible.builtin.copy:
    src: cert-manager.yaml
    dest: /tmp/cert-manager.yaml
    mode: '0644'

# Server-side apply: il CRD clusterissuers supera ~300KB, oltre il limite di
# 262KB dell'annotation last-applied usata dal client-side apply.
- name: Apply cert-manager manifest
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /tmp/cert-manager.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

# rollout status: in un upgrade aspetta i pod della nuova versione
# (condition=Available sarebbe già vera grazie ai pod vecchi).
- name: Wait for cert-manager rollout
  ansible.builtin.command: >
    kubectl rollout status deployment/{{ item }}
    -n cert-manager --timeout=300s
  loop:
    - cert-manager
    - cert-manager-cainjector
    - cert-manager-webhook
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
